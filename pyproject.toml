[project]
name = "waves-backend"
version = "0.1.0"
description = "Backend API for the Waves operational system."
readme = "README.md"

authors = [
    { name = "Lucas Barros", email = "lucasbarros2000@hotmail.com" }
]

requires-python = ">=3.12,<3.13"

dependencies = [
    "beanie>=2.2.0",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection requires calls like `Depends(...)` and
# `Security(...)` as argument defaults — this is the framework's documented,
# idiomatic pattern, not an accidental mutable-default bug. Without this
# allowlist, ruff's B008 flags every dependency-injected endpoint parameter.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]
