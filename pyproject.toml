[project]
name = "waves-backend"
version = "0.1.0"
description = "Backend API for the Waves operational system."
readme = "README.md"

authors = [
    { name = "Lucas Barros", email = "lucasbarros2000@hotmail.com" }
]

requires-python = ">=3.12,<3.13"

dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]
